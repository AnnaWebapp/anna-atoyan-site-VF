<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anna Atoyan — Styliste</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --dark: #111008;
    --gold: #b89b6a;
    --gold-light: #d4b98a;
    --muted: #8a7d6b;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'Raleway', sans-serif;
    color: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .noise {
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 360px;
    padding: 52px 40px 44px;
    background: var(--dark);
    color: var(--cream);
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.4;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .monogram {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 36px;
    display: block;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 38px;
    line-height: 1.05;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .name em {
    font-style: italic;
    color: var(--gold-light);
  }

  .title {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 44px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
    margin-bottom: 32px;
  }

  .contacts {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 44px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    transition: color 0.25s;
  }

  .contact-item:hover { color: var(--gold-light); }
  .contact-item:hover .icon-wrap { border-color: var(--gold); }

  .icon-wrap {
    width: 30px;
    height: 30px;
    border: 1px solid rgba(184,155,106,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.25s;
  }

  .icon-wrap svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .contact-text {
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
  }

  .btn:hover {
    background: var(--gold);
    color: var(--dark);
  }

  .btn svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
  }
  .corner-tl { top: 8px; left: 8px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); opacity: 0.4; }
  .corner-tr { top: 8px; right: 8px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); opacity: 0.4; }
  .corner-bl { bottom: 8px; left: 8px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); opacity: 0.4; }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); opacity: 0.4; }
</style>
</head>
<body>
<div class="noise"></div>
<div class="card">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <h1 class="name">Anna<br><em>Atoyan</em></h1>
  <p class="title">Styliste Personnelle</p>

  <div class="divider"></div>

  <div class="contacts">
    <a href="tel:+33638289079" class="contact-item">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <span class="contact-text">06 38 28 90 79</span>
    </a>
    <a href="mailto:contact@anna-atoyan.com" class="contact-item">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <span class="contact-text">contact@anna-atoyan.com</span>
    </a>
    <a href="https://anna-atoyan.com" target="_blank" class="contact-item">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <span class="contact-text">anna-atoyan.com</span>
    </a>
  </div>

  <a href="anna-atoyan.vcf" download="Anna-Atoyan.vcf" class="btn">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Ajouter à mes contacts
  </a>
</div>
</body>
</html>
